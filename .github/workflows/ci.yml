name: debim Model Validation & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml openpyxl pydantic
          pip install git+https://github.com/PRIDA-TAKON/debim.git || pip install debim || true

      - name: Run debim Validation
        run: |
          debim validate -m project.yaml || true

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v
